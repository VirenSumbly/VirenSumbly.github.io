<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>compyute</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Pixel-style terminal font -->
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0a0a0a;
      --fg: #f2f2f2;
      --accent: #00ff99;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: var(--bg);
      color: var(--fg);
      font-family: "IBM Plex Mono", "Courier New", monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
    }

    h1 {
      font-family: "VT323", monospace;
      font-size: 5rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--fg);
      margin: 0;
      padding: 0;
      /* text-shadow: 0 0 0px var(--fg); */
    }

    p {
      max-width: 550px;
      font-size: 0.95rem;
      line-height: 1.6;
      color: #aaa;
      margin: 1.5em 0;
    }

    .terminal {
      font-size: 0.9rem;
      background: rgba(255, 255, 255, 0.03);
      padding: 1em 1.5em;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.08);
      text-align: left;
      max-width: 600px;
    }

    .blink {
      animation: blink 1s step-start infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    footer {
      position: absolute;
      bottom: 30px;
      font-size: 0.8rem;
      color: #555;
      letter-spacing: 0.5px;
    }

    /* Small screen adjustments */
    @media (max-width: 600px) {
      h1 {
        font-size: 2.5rem;
      }
      p {
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <h1>compyute</h1>

  <p>a dev collective where we build, break, and learn in public.</p>

  <div class="terminal">
    <p><span style="color: var(--accent)">~/compyute$</span> whoami</p>
    <p>↳ experimenting with code, design, and systems.</p>

    <p><span style="color: var(--accent)">~/compyute$</span> status</p>
    <p>↳ early stage. recruiting ideas, not followers.</p>

    <p><span style="color: var(--accent)">~/compyute$</span> run future.sh<span class="blink">_</span></p>
  </div>

  <footer>© 2025 compyute // v0.1 alpha</footer>
</body>
</html>
